# Static obstacles use the existing HuNav max_vel field as the stationary
# marker. The patched Gazebo wrapper enforces this marker after every HuNav
# response, preserving the actor pose and reporting zero velocity.
hunav_loader:
  ros__parameters:
    map: open_area
    publish_people: true
    agents: [walker1, walker2, walker3, walker4, walker5, walker6, walker7, walker8]
    walker1:
      id: 1
      skin: 0
      group_id: -1
      max_vel: 0.0
      radius: 0.4
      behavior: {type: 1, configuration: 1, duration: 120.0, once: true, vel: 0.0, dist: 0.0, goal_force_factor: 2.0, obstacle_force_factor: 10.0, social_force_factor: 5.0, other_force_factor: 20.0}
      init_pose: {x: 1.3, y: 1.0, z: 1.25, h: 0.0}
      goal_radius: 0.3
      cyclic_goals: false
      goals: [g0]
      g0: {x: 1.3, y: 1.0, h: 0.0}
    walker2:
      id: 2
      skin: 1
      group_id: -1
      max_vel: 0.0
      radius: 0.4
