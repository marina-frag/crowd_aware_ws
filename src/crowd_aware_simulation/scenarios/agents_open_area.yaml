hunav_loader:
  ros__parameters:
    map: open_area
    publish_people: true
    agents: [distant_walker]
    distant_walker:
      id: 1
      skin: 0
      group_id: -1
      max_vel: 1.0
      radius: 0.4
      behavior: {type: 1, configuration: 1, duration: 90.0, once: true, vel: 0.7, dist: 0.0, goal_force_factor: 2.0, obstacle_force_factor: 10.0, social_force_factor: 5.0, other_force_factor: 20.0}
      init_pose: {x: 1.0, y: 4.5, z: 1.25, h: 0.0}
      goal_radius: 0.3
      cyclic_goals: true
      goals: [g0, g1]
      g0: {x: 7.0, y: 4.5, h: 0.0}
      g1: {x: 1.0, y: 4.5, h: 3.14159}
