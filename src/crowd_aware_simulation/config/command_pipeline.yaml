smoother:
  smoothing_frequency: 20.0
  scale_velocities: false
  feedback: OPEN_LOOP
  odom_duration: 0.1
  deadband_velocity:
  - 0.0
  - 0.0
  - 0.0
  velocity_timeout: 0.3
collision:
  transform_tolerance: 0.3
  source_timeout: 0.3
  base_shift_correction: true
  stop_pub_timeout: 0.3
  polygons:
  - FootprintApproach
  FootprintApproach:
    type: polygon
    action_type: approach
    time_before_collision: 1.2
    simulation_time_step: 0.05
    max_points: 1
    visualize: true
    enabled: true
  observation_sources:
  - scan
  scan:
    type: scan
    enabled: true
command_guard:
  output_rate: 20.0
final_cmd_watchdog:
  output_rate: 20.0
