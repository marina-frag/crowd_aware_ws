smoother:
  smoothing_frequency: 20.0
  scale_velocities: false
  feedback: OPEN_LOOP
  odom_duration: 0.1
  deadband_velocity:
  - 0.0
  - 0.0
  - 0.0
  velocity_timeout: 0.3
collision:
  transform_tolerance: 0.3
  source_timeout: 0.3
  base_shift_correction: true
  stop_pub_timeout: 0.3
  polygons:
  - FootprintApproach
  FootprintApproach:
    type: polygon
    action_type: approach
    # time_before_collision is not set here: prepare_scene.py derives it from the
    # braking model, T + v_max/(2a) (0.7 s with T=0.4 s, v_max=0.3 m/s, a=0.5 m/s2).
    simulation_time_step: 0.05
    max_points: 1
    visualize: true
    enabled: true
  observation_sources:
  - scan
  scan:
    type: scan
    enabled: true
final_cmd_watchdog:
  output_rate: 20.0
