scenario:
  name: group_blocking
  world: open_area.world
  agents: agents_group_blocking.yaml
  robot:
    path_xy:
    - - 0.0
      - 0.0
    - - 0.8
      - 0.0
    - - 1.6
      - 0.0
    - - 2.4
      - 0.0
    - - 3.2
      - 0.0
    - - 4.0
      - 0.0
    - - 4.8
      - 0.0
    - - 5.6
      - 0.0
    - - 6.4
      - 0.0
    - - 7.2
      - 0.0
    - - 8.0
      - 0.0
    # step 3 paths (input2.md decision N): world-frame waypoints, smooth spline
    path_shapes:
      detour_left:  # the user goes around the group on the left, then back to the line
        type: points
        points: [[0, 0], [1.5, 0], [2.5, 0.9], [4, 1.9], [5.5, 0.9], [6.5, 0], [8, 0]]
  evaluation:
    timeout: 120.0
  seed_variation:
    baseline_seed: 1
    start_fraction: 0.8
    speed_scale:
    - 0.85
    - 1.15
    static_below_mps: 0.1
    shift_x_m: 0.3
    shift_y_m: 0.2
