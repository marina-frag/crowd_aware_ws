scenario:
  name: cafe
  world: base_cafe.world
  agents: agents_cafe.yaml
  robot:
    path_xy:
    - - 0.0
      - 0.0
    - - 0.8
      - 0.0
    - - 1.6
      - 0.15
    - - 2.4
      - 0.15
    - - 3.2
      - 0.0
    # step 3 paths (input2.md decision N): world-frame waypoints, smooth spline;
    # the robot starts at the first waypoint, heading along the path
    path_shapes:
      between_tables:  # from the entrance around the first table, down the aisle between the table rows
        type: points
        points: [[0, 0], [-0.55, -1.0], [-0.7, -1.9], [0.0, -3.2], [0.45, -4.2], [0.45, -7.5]]
  evaluation:
    timeout: 90.0
  seed_variation:
    baseline_seed: 1
    start_fraction: 0.8
    speed_scale:
    - 0.85
    - 1.15
    static_below_mps: 0.1
    shift_x_m: 0.3
    shift_y_m: 0.2
