scenario:
  name: dense_static
  world: open_area.world
  agents: agents_dense_static.yaml
  intended_user:
    enabled: false
    agent_name: ''
  robot:
    path_xy:
    - - 0.0
      - 0.0
    - - 0.8
      - 0.0
    - - 1.6
      - 0.0
    - - 2.4
      - 0.0
    - - 3.2
      - 0.0
    - - 4.0
      - 0.0
    - - 4.8
      - 0.0
    - - 5.6
      - 0.0
    - - 6.4
      - 0.0
    - - 7.2
      - 0.0
    - - 8.0
      - 0.0
    path_shapes:
      line:
        type: line
        length_m: 8.0
      s_curve:
        type: lane_change
        length_m: 8.0
        offset_m: 1.5
      hard_curve:
        type: slalom
        length_m: 8.0
        amplitude_m: 0.4
        wavelength_m: 5.0
        ramp_m: 3.0
  evaluation:
    timeout: 120.0
  agent_layout:
    kind: static
    start_s: 1.3
    end_s: 7.7
    lateral_m:
      line: 1.0
      s_curve: 1.3
      hard_curve: 1.3
    first_side: left
    templates:
    - walker1
    - walker2
    - walker3
    - walker4
    - walker5
    - walker6
    - walker7
    - walker8
    density:
      sparse:
        spacing_m: 1.8
      medium:
        spacing_m: 0.9
      dense:
        spacing_m: 0.6
    min_center_distance_m: 0.9
    seed_variation:
      baseline_seed: 1
      along_m: 0.2
      lateral_m: 0.15
