scenario:
  name: junction
  world: junction.world
  agents: agents_junction.yaml
  robot:
    path_xy:
    - - 0.0
      - 0.0
    - - 0.8
      - 0.0
    - - 1.6
      - 0.0
    - - 2.4
      - 0.0
    - - 3.2
      - 0.0
    - - 4.0
      - 0.0
    - - 4.8
      - 0.0
    - - 5.6
      - 0.0
    - - 6.4
      - 0.0
    - - 7.2
      - 0.0
    - - 8.0
      - 0.0
    - - 8.8
      - 0.0
    - - 9.6
      - 0.0
    - - 10.0
      - 0.0
    # step 3 paths (input2.md decision N): world-frame waypoints, smooth spline;
    # the robot starts at the first waypoint, heading along the path
    path_shapes:
      left_turn:  # along the corridor to the centre, quarter circle r = 1 m, out to the north
        type: points
        points: [[0, 0], [3, 0], [4, 0], [4.707, 0.293], [5, 1], [5, 2], [5, 4]]
      straight_right:  # straight through the junction, keeping right
        type: points
        points: [[0, -0.4], [9.5, -0.4]]
  evaluation:
    timeout: 110.0
  seed_variation:
    baseline_seed: 1
    start_fraction: 0.8
    speed_scale:
    - 0.85
    - 1.15
    static_below_mps: 0.1
    shift_x_m: 0.3
    shift_y_m: 0.2
