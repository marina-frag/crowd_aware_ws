scenario:
  name: narrow_corridor
  world: narrow_corridor.world
  agents: agents_narrow_corridor.yaml
  robot:
    path_xy:
    - - 0.0
      - 0.0
    - - 0.8
      - 0.0
    - - 1.6
      - 0.0
    - - 2.4
      - 0.0
    - - 3.2
      - 0.0
    - - 4.0
      - 0.0
    - - 4.8
      - 0.0
    - - 5.6
      - 0.0
    - - 6.4
      - 0.0
    - - 7.2
      - 0.0
    - - 8.0
      - 0.0
    # step 3 paths (input2.md decision N): world-frame waypoints, smooth spline;
    # the robot starts at the first waypoint, heading along the path
    path_shapes:
      keep_right:  # straight, keeping to the right side of the corridor
        type: points
        points: [[0, -0.4], [8, -0.4]]
  evaluation:
    timeout: 100.0
  seed_variation:
    baseline_seed: 1
    start_fraction: 0.8
    speed_scale:
    - 0.85
    - 1.15
    static_below_mps: 0.1
    shift_x_m: 0.3
    shift_y_m: 0.2
