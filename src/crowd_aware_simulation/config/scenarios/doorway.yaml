scenario:
  name: doorway
  world: doorway.world
  agents: agents_doorway.yaml
  robot:
    path_xy:
    - - 0.0
      - 0.0
    - - 0.8
      - 0.0
    - - 1.6
      - 0.0
    - - 2.4
      - 0.0
    - - 3.2
      - 0.0
    - - 4.0
      - 0.0
    - - 4.8
      - 0.0
    - - 5.6
      - 0.0
    - - 6.4
      - 0.0
    - - 7.2
      - 0.0
    - - 8.0
      - 0.0
    # step 3 paths (input2.md decision N): world-frame waypoints, smooth spline;
    # the robot starts at the first waypoint, heading along the path
    path_shapes:
      side_approach:  # starts 1.2 m to the side, lines up before the door, passes it square-on
        type: points
        points: [[0, -1.2], [1.2, -1.05], [2.4, -0.3], [3.2, 0], [4, 0], [8, 0]]
      u_turn:  # down along the wall, through the door, back up along the other side
        type: points
        points: [[2.6, 3.5], [2.6, 2.2], [2.85, 1.0], [3.4, 0.25], [4, 0.05], [4.6, 0.25], [5.15, 1.0], [5.4, 2.2], [5.4, 3.5]]
  evaluation:
    timeout: 100.0
  seed_variation:
    baseline_seed: 1
    start_fraction: 0.8
    speed_scale:
    - 0.85
    - 1.15
    static_below_mps: 0.1
    shift_x_m: 0.3
    shift_y_m: 0.2
