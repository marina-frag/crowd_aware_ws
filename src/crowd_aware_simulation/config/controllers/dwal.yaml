generator:
  dwal_generator/min_trans_vel: 0.05
  dwal_generator/sim_period: 0.2
  # Arc-length step of the path simulation (m), same for fixed and dynamic DWAL
  # so the two differ only in the clustering/admissibility logic.
  dwal_generator/DS: 0.05
  dwal_generator/alpha: 0.05
  # DWAL path rate: the generator's main loop (rclcpp::Rate) takes the latest /odom
  # at this rate, as in the original dwal_planner (default 5 Hz). 5 Hz: the costmap
  # publishes at 5 Hz (costmap.yaml), and at iWalk's 0.3 m/s the robot moves 6 cm
  # between path sets. Keep it a divisor of the /odom rate (Gazebo: 20 Hz,
  # simulation.yaml publish_rate) so no odometry period is skipped irregularly.
  dwal_generator/Hz: 5.0
clustering:
  dwal_clustering/postfix:
    when_true:
    - far
    when_false:
    - near
    - far
  dwal_clustering/spin:
    when_true:
    - 1
    when_false:
    - 1
    - 1
  dwal_clustering/subsample_step: 3
shared_common:
  use_stamped_twist_input: false
  use_stamped_twist_output: false
  allow_no_cluster_passthrough: false
  social_weight: 0.35
  c_max: 255.0
  alpha: 0.7
  s_min: 0.2
  Kphi: 1.5
  v_low: 0.22
  v_high: 0.28
  intent.alpha: 0.92
  intent.beta: 8.0
  intent.eta: 0.5
  intent.sigma_min: 0.03
  intent.min_confidence: 0.0
  inplace_via_collision_monitor: true
  intent_reference_radius:
    when_false: 0.0
