experiment:
  frames:
    global: odom
    base: sim_base
    robot_description_base: base_link
    laser: laser_frame
  topics:
    odom: /odom
    scan: /scan
    human_states: /human_states
    tracked_agents_controller: /tracked_agents
    tracked_agents_logging: /tracked_agents_logging
    reference_cmd: /reference_cmd
    selected_cmd: /cmd_vel_selected
    smoothed_cmd: /cmd_vel_smoothed
    collision_checked_cmd: /cmd_vel_safe
    final_cmd: /cmd_vel
    scan_raw: /scan_raw
    robot_states: /robot_states
    agents_info: /agents_info
    costmap: /local_costmap/costmap
    published_footprint: /local_costmap/published_footprint
    path: /experiment/path
    clusters_near: /dwal_planner/clusters_near
    clusters_far: /dwal_planner/clusters_far
    costmap_updates: /local_costmap/costmap_updates
    tracked_agents_disabled: /tracked_agents_disabled
  limits:
    max_linear: 0.3
    max_angular: 0.8
    acceleration: 0.5
    deceleration: 0.5
    angular_acceleration: 1.0
    angular_deceleration: 1.0
  timeouts:
    odom: 0.5
    clusters: 0.5
    reference: 0.35
    tracks: 0.5
    final_input: 0.3
  dwal:
    fixed_levels:
    - 1.2
    - 1.8
    front_extent: 0.865
    rear_extent: 0.103
    cluster_separation: 5
    min_cluster_span: 0.2
    max_curvature: 4.0
  dynamic_dwal:
    max_search_radius: 1.8
    # Split a cluster where the free length of neighbouring accepted paths jumps
    # by more than this (m): "towards the obstacle" vs "past it" (depth
    # discontinuity, Nearness Diagram). Runtime value, no build needed; the
    # dynamic_no_split variant disables it.
    length_jump_threshold: 0.3
    # Cluster ID correspondence between frames:
    #   upstream: greedy matching of mean cluster angles (original dwal_planner,
    #             with the duplicate-ID bug fixed)
    #   tracking: interval IoU + optimal order-preserving assignment + gating +
    #             track management (IDs never reused) + split/merge belief sharing
    #             + ego-motion compensation
    correspondence: upstream
    correspondence_gate: 0.2     # tracking: minimum IoU to inherit an ID
    track_keep_frames: 2         # tracking: frames a lost ID is kept (2 = 0.4 s at 5 Hz)
    reaction_time: 0.4
    longitudinal_margin: 0.05
    prediction_horizon: 2.0
    human_base_uncertainty: 0.1
    human_uncertainty_growth: 0.1
  geometry:
    footprint_padding: 0.02
  human_model:
    radius: 0.4
  evaluation_defaults:
    goal_tolerance: 0.2
    personal_space: 0.8
    yaw_goal_tolerance: 0.25
